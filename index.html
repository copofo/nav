<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Central de Downloads</h1>
        <p id="os-detect">Detectando sistema...</p>
    </header>

    <div class="download-card">
        <div class="icon">🔥</div>
        <div class="info">
            <h2>Firefox Portable</h2>
            <p>Executável portátil para Windows</p>
            <span>Tamanho: 110 MB</span>
        </div>
        <button onclick="startDownload(firefoxLink)">
            Baixar
        </button>
    </div>

    <div class="download-card">
        <div class="icon">📦</div>
        <div class="info">
            <h2>App</h2>
            <p>Pasta compactada</p>
            <span>Tamanho: 25 MB</span>
        </div>
        <button onclick="startDownload(appLink)">
            Baixar
        </button>
    </div>

    <div class="progress-area">
        <p id="progress-text"></p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
